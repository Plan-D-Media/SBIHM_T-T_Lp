  <title>Thank You — SBIHM Kolkata | Travel &amp; Tourism Management Admissions</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    :root {
      --sbihm-red: #D24130;
      --sbihm-red-dark: #A0341F;
      --sbihm-red-soft: #F8E5E1;
      --sbihm-black: #1A1A1A;
      --sbihm-charcoal: #3A3A3A;
      --sbihm-gold: #D4A017;
      --sbihm-gold-light: #F0D17A;
      --sbihm-cream: #FAF7F2;
      --sbihm-paper: #FFFFFF;
      --sbihm-line: #E8E5DD;
      --sbihm-mute: #6B6B6B;
      --sbihm-success: #2E7D32;
      --font-display: 'Bricolage Grotesque', 'Playfair Display', Georgia, serif;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      color: var(--sbihm-black);
      background: var(--sbihm-paper);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .thank-you-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1rem;
      background-color: var(--sbihm-cream);
      text-align: center;
    }

    .thank-you-card {
      background: var(--sbihm-paper);
      padding: 4rem 2rem;
      border-radius: 12px;
      box-shadow: var(--sbihm-shadow, 0 8px 30px rgba(26, 26, 26, 0.08));
      max-width: 600px;
      width: 100%;
    }

    .thank-you-card__icon {
      width: 80px;
      height: 80px;
      background: rgba(46, 125, 50, 0.1);
      color: var(--sbihm-success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .thank-you-card__icon svg {
      width: 40px;
      height: 40px;
    }

    .thank-you-card__title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 3vw + 1rem, 2.5rem);
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .thank-you-card__text {
      font-size: 1.125rem;
      color: var(--sbihm-charcoal);
      margin-bottom: 2.5rem;
    }

    .thank-you-card__actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Additional override in case standard btn--whatsapp isn't in main css for this page */
    .btn--whatsapp {
      background-color: #25D366;
      color: white;
      border: 1px solid #25D366;
    }
    .btn--whatsapp:hover {
      background-color: #128C7E;
      color: white;
    }
  </style>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5KFQNGBB" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- ===== SECTION 1: Top Utility Bar ===== -->
  <div class="utility-bar" role="banner">
    <div class="utility-bar__inner">
      <span class="utility-bar__announce">
        <svg class="icon icon--sm" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
          <path d="M6 12v5c3 3 9 3 12 0v-5" />
        </svg>
        Admissions 2026–27 Now Open &bull; Limited Seats
      </span>
      <div class="utility-bar__contact">
        <a href="tel:+919830012536" class="utility-bar__link">
          <svg class="icon icon--sm" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path
              d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z" />
          </svg>
          +91 98300 12536
        </a>
      </div>
    </div>
  </div>

  <!-- ===== SECTION 2: Sticky Main Header ===== -->
  <header class="site-header" id="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="site-header__logo" aria-label="SBIHM Home">
        <img src="assets/images/sbihm-logo.jpg" alt="SBIHM — Subhas Bose Institute of Hotel Management, Kolkata"
          width="200" height="52" loading="eager">
      </a>
      <div class="site-header__actions">
        <a href="index.html" class="btn btn--outline-red">Back to Home</a>
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="main-content" class="thank-you-section">
    <div class="thank-you-card">
      <div class="thank-you-card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </div>
      <h1 class="thank-you-card__title">Application <span class="text-red">Received!</span></h1>
      <p class="thank-you-card__text">
        Our counsellor will reach out to you within 5 minutes. Check your WhatsApp for updates.
      </p>
      <div class="thank-you-card__actions">
        <a href="https://wa.me/919830012536?text=Hi%20SBIHM%2C%20I%20just%20submitted%20my%20enquiry%20form"
          class="btn btn--whatsapp" target="_blank" rel="noopener noreferrer">
          Chat on WhatsApp Now →
        </a>
        <a href="index.html" class="btn btn--gold">
          Return to Website
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" style="margin-top: auto; padding: 1.5rem 0; border-top: 1px solid var(--sbihm-line);">
    <div class="site-footer__sub" style="padding: 0;">
      <div class="container">
        <p class="site-footer__sub-text" style="text-align: center; margin: 0;">
          Copyright &copy; 2026 SBIHM &bull;
          <a href="#" class="site-footer__sub-link">Privacy Policy</a> &bull;
          <a href="#" class="site-footer__sub-link">Terms</a>
        </p>
      </div>
    </div>
  </footer>

</body>

</html>
